name: Something didn't work
description: Setup failed, a twin didn't build, or the app crashed or behaved oddly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Persona Twin! Please **don't paste anyone's private messages** here;
        describe the problem instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? Paste any error text.
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Which step?
      options: ["1. Set up", "2. Build a twin", "3. Talk", "Command line (run.py)", "Other"]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Your computer
      placeholder: "Windows 11, 8 GB RAM, no graphics card"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: How are you running it?
      options: ["PersonaTwin.exe (Windows release)", "From source"]
