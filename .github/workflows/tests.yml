name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # Only what the tests import. The heavy AI packages (PyTorch, Whisper, XTTS, MediaPipe)
        # are loaded lazily by the app and replaced by fakes in the tests.
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests soundfile pypdf pillow pillow-heif opencv-contrib-python-headless
      - name: Run tests
        run: python -m unittest
